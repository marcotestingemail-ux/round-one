<header class="bg-primary text-primary-content" data-feature="header">
  <nav aria-label="Main" class="navbar mx-auto max-w-6xl flex-col gap-2 px-4 sm:flex-row sm:justify-between">
    <a routerLink="/" class="btn btn-ghost text-xl font-semibold tracking-wide">{{ header.brand }}</a>

    <div class="flex flex-col items-center gap-2 sm:flex-row sm:gap-4">
      <ul class="menu menu-horizontal gap-1 p-0">
        @for (link of header.links; track link.path) {
          <li>
            <a [routerLink]="link.path">{{ link.label }}</a>
          </li>
        }
      </ul>

      <ul class="flex items-center gap-1">
        @for (social of header.socials; track social.label) {
          <li>
            <a
              class="btn btn-ghost btn-circle"
              [href]="social.href"
              target="_blank"
              rel="noopener noreferrer"
              [attr.aria-label]="social.label + ' (opens in a new tab)'"
            >
              @if (social.icon === 'instagram') {
                <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="2" y="2" width="20" height="20" rx="5" ry="5" />
                  <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" />
                  <line x1="17.5" y1="6.5" x2="17.51" y2="6.5" />
                </svg>
              } @else {
                <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z" />
                </svg>
              }
            </a>
          </li>
        }
      </ul>
    </div>
  </nav>
</header>
